[package]
name = "limusic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Limusic's Tauri-free account/library/settings logic — forked from src-tauri, consumed by crates/server (openspec/changes/signed-in-http-parity)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
futures-util = { workspace = true }

innertube = { path = "../innertube" }

# Cipher/BotGuard streaming stack (openspec/changes/http-audio-streaming). BotGuard runs under
# deno_core + JSDOM, not a webview (same reason as src-tauri's copy — a minimal-DOM runtime is the
# only one that mints a token googlevideo accepts). Pinned to the exact version `rustypipe-botguard`
# already resolves (`cargo tree -i v8` must show exactly one `v8` after this — design.md D2): two
# different v8 builds in one process is a hard crash, not a degraded mode.
rustypipe-botguard = "0.1.2"
deno_core = "=0.331.0"
serde_v8 = "=0.240.0"

rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
bytes = "1"
base64 = "0.22"
regex = "1"
urlencoding = "2"
md-5 = "0.10"

# Romanized lyrics (romanize.rs) — same pin as src-tauri, see its Cargo.toml comment.
lindera = { version = "=0.30.0", default-features = false, features = ["ipadic"] }
wana_kana = { version = "5", default-features = false }
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
any_ascii = "0.3"
