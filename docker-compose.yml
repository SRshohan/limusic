services:
  limusic-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Host-side Caddy (already running outside Docker on this VPS for other sites) reverse-proxies
    # to this port; bound to loopback only, same pattern as this host's other containerized apps.
    ports:
      - '127.0.0.1:8900:8787'
    volumes:
      - limusic-data:/data

volumes:
  limusic-data:
