<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>SRMusic — Profile (mockup)</title>
	<link rel="icon" href="assets/icon.svg" />
	<link rel="stylesheet" href="tokens.css" />
	<style>
		.stack-header {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 16px;
		}
		.stack-header h1 {
			font-size: 18px;
			margin: 0;
		}
		.account-card {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 14px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
		}
		.account-card .avatar-circle {
			width: 48px;
			height: 48px;
			font-size: 18px;
		}
		.badge {
			font-size: 11px;
			font-weight: 700;
			padding: 3px 9px;
			border-radius: var(--radius-pill);
			background: var(--primary-tint);
			color: var(--primary-strong);
		}
		:root[data-theme='dark'] .badge {
			color: var(--primary);
		}
		.account-row {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 10px 4px;
		}
		.account-row .avatar-circle {
			width: 38px;
			height: 38px;
			font-size: 14px;
		}
		.list-btn {
			display: flex;
			align-items: center;
			gap: 12px;
			width: 100%;
			padding: 12px 4px;
			font-size: 14.5px;
			font-weight: 600;
			text-align: left;
		}
		.list-btn.danger {
			color: var(--danger);
		}
		.chevron {
			margin-left: auto;
			color: var(--text-faint);
		}
	</style>
</head>
<body>
	<button class="theme-toggle" aria-label="Toggle theme"></button>
	<div class="phone">
		<div class="stack-header">
			<a href="home.html" class="icon-btn" aria-label="Back" style="background:var(--surface-alt)">←</a>
			<h1>Profile</h1>
		</div>

		<div class="content">
			<section>
				<div class="account-card">
					<div class="avatar-circle">S</div>
					<div class="track-meta">
						<div class="track-title" style="font-size:15px">Sohanur Rahman</div>
						<div class="track-artist">sohanur.rahman@manhattan.edu</div>
					</div>
					<span class="badge">Active</span>
				</div>
			</section>

			<section>
				<h2 class="section-title">Switch account</h2>
				<div class="account-row">
					<div class="avatar-circle" style="background:linear-gradient(135deg,#58c9ff,#2a7bd1)">M</div>
					<div class="track-meta">
						<div class="track-title">Mom's Account</div>
						<div class="track-artist">@momlistens</div>
					</div>
				</div>
				<div class="account-row">
					<div class="avatar-circle" style="background:linear-gradient(135deg,#ffb86b,#e0672c)">J</div>
					<div class="track-meta">
						<div class="track-title">Jamie</div>
						<div class="track-artist">@jamie.r</div>
					</div>
				</div>
				<a href="cookie.html" class="list-btn" style="color:var(--primary-strong)">
					<span style="font-size:17px">+</span> Add another account
				</a>
			</section>

			<section>
				<h2 class="section-title">This device</h2>
				<a href="settings.html" class="list-btn">
					⚙️ Settings
					<span class="chevron">›</span>
				</a>
				<button class="list-btn danger">
					🚪 Sign out
				</button>
			</section>

			<section>
				<div style="text-align:center;padding:12px 0;color:var(--text-faint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px">
					<img src="assets/icon.svg" alt="" width="36" height="36" style="border-radius:22%" />
					SRMusic · one server, several accounts —<br />everyone keeps their own library.
				</div>
			</section>
		</div>

		<div class="mini-player" onclick="location.href='now-playing.html'" style="cursor:pointer;padding-bottom:calc(10px + var(--safe-bottom))">
			<div class="progress-track" style="position:absolute;top:0;left:0;right:0"><div class="progress-fill" style="width:38%"></div></div>
			<div class="track-art art-1"></div>
			<div class="track-meta">
				<div class="track-title">Thriller</div>
				<div class="track-artist">Michael Jackson</div>
			</div>
			<div class="mini-controls">
				<button class="icon-btn primary" aria-label="Pause" onclick="event.stopPropagation()">⏸</button>
				<button class="icon-btn" aria-label="Next" onclick="event.stopPropagation()">⏭</button>
			</div>
		</div>
	</div>
	<script src="common.js"></script>
</body>
</html>
