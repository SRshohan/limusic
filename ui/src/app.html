<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Manual, not plugin-auto-injected: this app is ssr=false with an adapter-static SPA
		     fallback shell, which the plugin's usual per-request head injection doesn't reach. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0b0b0f" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/pwa-192.png" />
		<!-- WebView2 (Windows) is Chromium, where some paint tricks that help WebKitGTK cost frames
		     instead. See `.art-wash` in layout.css. -->
		<script>
			if (/Chrome\//.test(navigator.userAgent)) document.documentElement.classList.add('chromium');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
